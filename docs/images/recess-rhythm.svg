      <path d="M76 93V109M52 110H100" stroke="#8fae9a" stroke-width="3" stroke-linecap="round"/>
      <rect x="1" y="118" width="150" height="5" rx="2.5" fill="#d7e2d3"/>
    </g>
    <circle cx="480" cy="147" r="89" fill="#dce9d8"/>
    <rect x="405" y="72" width="150" height="150" rx="38" fill="url(#pause)"/>
