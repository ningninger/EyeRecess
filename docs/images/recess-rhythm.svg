<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" fill="none" role="img" aria-labelledby="title description">
  <title id="title">A little space between tasks</title>
  <desc id="description">Three illustrated moments: work, pause, and return. A winding green line connects a desktop, a resting eye, and a growing plant.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#174c3f" opacity=".07"/>
    </pattern>
    <linearGradient id="pause" x1="398" y1="70" x2="562" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#205c4b"/>
      <stop offset="1" stop-color="#123a31"/>
    </linearGradient>
  </defs>
  <rect width="960" height="300" rx="24" fill="#f3f5ed"/>
  <rect width="960" height="300" rx="24" fill="url(#dots)"/>
  <path d="M170 170C282 170 280 108 393 130M567 153C680 130 660 196 780 170" stroke="#bdd7bf" stroke-width="2" stroke-dasharray="5 7" stroke-linecap="round"/>
