name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # 测试用的是假 electron，不需要真的下载 100MB 运行时
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # electron-builder 26 需要 npm 的 lockfileVersion 2/3，npm ci 会自动匹配

      - name: Install
        run: npm ci

      - name: Logic tests (timing model, config, stats, DND)
        run: npm run test:logic

      - name: Boot tests (fake electron + virtual clock, 4h of usage)
        run: npm run test:boot

      - name: Syntax check every source file
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \))
          exit $fail
