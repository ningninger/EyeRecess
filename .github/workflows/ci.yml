name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # 测试用的是假 electron，不需要真的下载 100MB 运行时
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # electron-builder 26 需要 npm 的 lockfileVersion 2/3，npm ci 会自动匹配

      - name: Install
        run: npm ci

      - name: Logic tests (timing model, config, stats, DND)
        shell: bash
        run: |
          set +e
          npm run test:logic > logic.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # 把失败行变成 annotation：公开仓库的日志需要 token 才能下载，
            # 但 annotation 是公开的，出问题不用登进来也能看到具体断言。
            grep -aE "✗|失败|Error|error:|AssertionError" logic.log | head -20 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r')"
            done
            tail -40 logic.log
            exit $code
          fi
          tail -3 logic.log

      - name: Boot tests (fake electron + virtual clock, 4h of usage)
        shell: bash
        run: |
          set +e
          npm run test:boot > boot.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -aE "✗|失败|Error|error:|AssertionError" boot.log | head -20 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r')"
            done
            tail -60 boot.log
            exit $code
          fi
          tail -3 boot.log

      - name: Syntax check every source file
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find src scripts -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \))
          exit $fail
