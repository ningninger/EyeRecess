name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build .dmg / .zip (arm64 + x64)
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set +e
          npm run dist:mac > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -aiE "error|cannot|failed|invalid|⨯" build.log | head -20 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r')"
            done
            tail -60 build.log
            exit $code
          fi
          tail -20 build.log
          ls -la dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 7

  build-win:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build installer + portable
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set +e
          npm run dist:win > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -aiE "error|cannot|failed|invalid|⨯" build.log | head -20 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r')"
            done
            tail -60 build.log
            exit $code
          fi
          tail -20 build.log
          ls -la dist || true
      - uses: actions/upload-artifact@v4
        with:
          name: win
          if-no-files-found: error
          path: dist/*.exe
          retention-days: 7

  publish:
    name: Publish release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (process.env.RELEASE_TAG !== `v${version}`) throw new Error('Release tag must match package.json');
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          const marker = `## ${version}\n`;
          const start = changelog.indexOf(marker);
          if (start < 0) throw new Error('Missing versioned changelog');
          const changes = changelog.slice(start + marker.length).split('\n## ')[0].trim();
          const notes = [
            `EyeRecess ${process.env.RELEASE_TAG} helps you build a regular screen-break habit.`,
            changes,
            '### Download and update',
            'Choose the DMG for your Mac architecture, or the Windows installer or portable executable. Downloads include the runtime; Node.js, npm, and a separate Electron installation are not required. Source archives require developer setup.',
            'Quit the old app before replacing it with this build. Settings and daily summaries are retained. Check the version in Settings after reopening. EyeRecess has no automatic updater.',
            'Current builds are unsigned and may trigger an operating system warning. See the README for installation guidance and limitations.',
          ].join('\n\n') + '\n';
          fs.mkdirSync('.local/release', { recursive: true });
          fs.writeFileSync('.local/release/notes.md', notes);
          JS

      - name: Checksums
        run: |
          cd artifacts
          find . -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body_path: .local/release/notes.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/SHA256SUMS.txt
